name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Evaluación sin modelo: mide búsqueda y router de forma determinística y gratis.
      - run: npm run eval
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: none
      - run: npm run build
        env:
          LLM_PROVIDER: mock
