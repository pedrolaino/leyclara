name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: leyclara
          POSTGRES_PASSWORD: leyclara
          POSTGRES_DB: leyclara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leyclara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://leyclara:leyclara@localhost:5432/leyclara_test
      # The committed JSON has to match what the parser produces.
      - run: npm run ingest && git diff --exit-code data/laws
        env:
          EMBEDDING_PROVIDER: none
      # No model here: checks search and routing only.
      - run: npm run eval
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: none
      - run: npm run build
        env:
          LLM_PROVIDER: mock
